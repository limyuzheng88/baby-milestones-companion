name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10 crashes resolving this dependency tree; npm 11 is required.
      - run: npx -y npm@11 ci
      - run: npm run typecheck
      - run: npx vitest run
      - name: Personal-data scan
        run: npm run scan:personal
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
