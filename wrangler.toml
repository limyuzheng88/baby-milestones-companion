name = "baby-milestones-companion"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "baby-milestones"
# Replace with the id printed by `wrangler d1 create baby-milestones`.
database_id = "d4a478b4-b09c-4550-b8b4-845f8701ec7e"
migrations_dir = "migrations"

[observability]
enabled = true
